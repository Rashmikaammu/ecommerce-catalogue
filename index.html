<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEasy</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
        <button id="cartButton">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <section class="hero" id="home">
        <h2>Discover Your Favourite Products</h2>
        <p>Great products. Great prices. Happy shopping!</p>
        <a href="#products" class="shopButton">Shop Now</a>
    </section>

    <main id="products">
        <h2>Our Products</h2>

        <div class="controls">
            <input type="text" id="searchInput"
                   placeholder="Search products...">

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <div id="productList" class="products"></div>

        <section id="cartSection">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3 id="cartTotal">Total: ₹0</h3>
            <button id="clearCart">Clear Cart</button>
        </section>
    </main>

    <footer id="contact">
        <h3>ShopEasy</h3>
        <p>Your one-stop destination for online shopping.</p>
        <p>Contact: support@shopeasy.example</p>
        <p>© 2026 ShopEasy. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
